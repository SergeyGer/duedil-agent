# DueDil.Agent — one-command local stack.
#
#   cp env.example .env      # optional: without it the app degrades gracefully
#   docker compose up --build
#   open http://localhost:8501
#
# Nothing here starts by itself. `restart: "no"` means the services do not come back
# after a server reboot or a Docker daemon restart, and they only stay up while a
# work session is open. Start and stop the stack with the project scripts, which work
# the same way on Linux and Windows:
#
#   ./scripts/project.sh start        # PowerShell: .\scripts\project.ps1 start
#   ./scripts/project.sh stop
#   ./scripts/project.sh status
#
# See Run_Stop_Project.docx in the repository root for the full walkthrough.
#
# The CLI is a separate, profile-gated service (it exits when the run finishes):
#
#   docker compose run --rm cli examples/sample_deck.pdf https://nimbusai.example
#
# `docker compose run` always mounts the volumes below, and the named volume owns
# /app/data, so the container writes memos with `duedil` ownership rather than
# leaving root-owned files behind on the host.

name: duedil-agent

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: duedil-agent:latest
    container_name: duedil-agent-ui
    # `required: false` keeps the stack bootable without a .env (no LLM keys ->
    # pypdf parsing + deterministic fallback memo).
    env_file:
      - path: .env
        required: false
    ports:
      - "8501:8501"
    volumes:
      # Named volume for generated reports/uploads: the container runs as a
      # non-root user, which cannot write into a root-owned bind mount.
      - duedil-data:/app/data
      # Read-only access to the bundled sample deck.
      - ./examples:/app/examples:ro
    # Deliberately `no`. The alternatives (`always`, `unless-stopped`) bring the service
    # back when the Docker daemon starts, i.e. after a server reboot, and then it holds
    # port 8501 until someone stops it by hand — which is what this project must not do.
    # A crashed process inside an active session is restarted by the scripts instead, so
    # the behaviour is visible rather than silent.
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Usage: docker compose run --rm cli <deck.pdf> [url] [options]
  # Profile-gated, so it is not part of a plain `up` and never runs unattended.
  cli:
    profiles: ["cli"]
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile
    image: duedil-agent:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - duedil-data:/app/data
      - ./examples:/app/examples:ro
    entrypoint: ["python", "-m", "app.cli"]

volumes:
  duedil-data:
