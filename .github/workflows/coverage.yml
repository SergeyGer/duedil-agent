name: Coverage badge

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  # Opening the badge pull request.
  pull-requests: write

concurrency:
  group: coverage-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    # Never run on the badge's own commit (avoid an infinite loop).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Measure coverage
        run: pytest --cov=app --cov-report= -q

      - name: Generate badge
        run: python scripts/coverage_badge.py .github/badges/coverage.svg

      # `main` is protected by a ruleset (pull request + required status checks), so the
      # badge cannot be pushed straight to it: that ended in `GH013` on every run.
      #
      # The refresh is published on `chore/coverage-badge` and offered as a pull request.
      # It cannot merge itself, and that is a GitHub constraint rather than a bug: this
      # job pushes with the built-in GITHUB_TOKEN, and GitHub suppresses workflow runs
      # for events created by that token (loop prevention), so the required checks never
      # report on the branch and auto-merge stays pending. Merge the PR when convenient -
      # it only ever touches `.github/badges/coverage.svg`.
      #
      # To make it fully hands-off, check out with a GitHub App / PAT token instead
      # (bypassing protection is also possible, but that defeats the ruleset).
      - name: Publish the badge on a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B chore/coverage-badge
          git add -f .github/badges/coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push --force origin chore/coverage-badge

          if ! gh pr view chore/coverage-badge >/dev/null 2>&1; then
            gh pr create --base "${{ github.ref_name }}" --head chore/coverage-badge \
              --title "chore: update coverage badge" \
              --body "Automated refresh of \`.github/badges/coverage.svg\` from the coverage workflow. Only this file changes; merge whenever convenient."
          fi

          gh pr merge chore/coverage-badge --squash --auto \
            || echo "Auto-merge not armed - merge the badge pull request manually."
