name: Coverage badge

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    # Never run on the badge's own commit (avoid an infinite loop).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Measure coverage
        run: pytest --cov=app --cov-report= -q

      - name: Generate badge
        run: python scripts/coverage_badge.py .github/badges/coverage.svg

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: ".github/badges/coverage.svg"
