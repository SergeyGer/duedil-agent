name: Docs

# Documentation is checked like code: local links and anchors, ADR structure, wiki metadata,
# the generated reference page. The job name is what the branch ruleset requires, so renaming
# it also means updating the ruleset.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Docs · links + ADR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      # The validator is standard-library only on purpose, so it runs before the app
      # dependencies (which take a minute and are irrelevant to documentation).
      - name: Validate links, anchors, ADRs, wiki metadata and the generated reference
        run: python scripts/validate_docs.py --verbose
