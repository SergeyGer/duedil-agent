name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned to match pyproject.toml ([dev]) and .pre-commit-config.yaml so a local
        # hook run and CI cannot disagree (see tests/test_tooling_pins.py).
        run: pip install "ruff==0.16.8"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        # Local hooks are opt-in (`pre-commit install`); running them here keeps
        # contributors who skip that honest about whitespace, EOF newlines, mixed line
        # endings and large files. Also proves .pre-commit-config.yaml still resolves.
        run: pre-commit run --all-files --show-diff-on-failure
