name: Publish image

# Publishes the container image to GitHub Container Registry on every release tag, so a
# user can run DueDil.Agent without cloning or building anything:
#
#   docker run --rm -p 8501:8501 ghcr.io/sergeyger/duedil-agent:0.1.0
#
# GitHub Packages is free for public packages, and so are Actions minutes in a public
# repository, so this workflow costs nothing to run.
#
# After a successful push the image is smoke-tested: it is started, and the workflow waits
# for Docker's HEALTHCHECK (Streamlit's /_stcore/health) to report `healthy`. A broken
# image therefore fails the release instead of reaching users.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. edge); defaults to the branch name"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Required to push the image.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # arm64 as well as amd64: the image is a demo, and half the laptops are Apple silicon.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The lockfile pins every package, so the pip layer only changes when the
          # lockfile does.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke-test the published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The runner is amd64, so run that half of the manifest.
          docker run --rm -d --name duedil-smoke -p 8501:8501 \
            --platform linux/amd64 "$IMAGE"

          status=""
          for _ in $(seq 1 24); do
            sleep 5
            status="$(docker inspect --format '{{.State.Health.Status}}' duedil-smoke || echo unknown)"
            echo "health: $status"
            [ "$status" = "healthy" ] && break
          done

          docker logs duedil-smoke 2>&1 | tail -20 || true
          docker rm -f duedil-smoke >/dev/null 2>&1 || true

          if [ "$status" != "healthy" ]; then
            echo "::error::the published image did not become healthy"
            exit 1
          fi
          echo "✅ $IMAGE is healthy"

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "docker run --rm -p 8501:8501 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
