version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      # These are pinned transitively and must stay in lock-step with their parent
      # packages (pydantic-core==x is pinned by pydantic, marshmallow<4 by
      # dataclasses-json, websockets<17 by langgraph-sdk, ...). Update them by
      # re-freezing the lock (`pip install -U <pkg> && pip freeze`), not via a PR.
      - dependency-name: "marshmallow"
      - dependency-name: "websockets"
      - dependency-name: "pydantic-core"
      - dependency-name: "uuid-utils"
      - dependency-name: "llama-cloud"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Keeps the `rev:` pins in .pre-commit-config.yaml (pre-commit-hooks, ruff-pre-commit).
  # A `ruff-pre-commit` bump cannot be merged on its own: the ruff version is pinned in
  # three places (.pre-commit-config.yaml, pyproject.toml [dev] and the CI lint job) and
  # tests/test_tooling_pins.py fails until all three agree.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
