coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: false
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "app/ui.py"
  - "tests/"
  - "data/"
  - "**/__init__.py"

flag_management:
  default_rules:
    carryforward: true
