[theme]
primaryColor = "#1a4d8f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f9"
textColor = "#1f2933"
font = "sans serif"

[browser]
gatherUsageStats = false

# The uploader promises "200MB per file"; make that the server's own limit instead of relying
# on the default, so the UI and the server agree.
[server]
maxUploadSize = 200

# The app is the product: hide Streamlit's Deploy/Fork toolbar in the hosted demo.
[client]
toolbarMode = "minimal"
